# License and SBOM scan. `sbom` is a required context (classic branch protection, not a ruleset --
# T-675) and carries no condition (T-633: a job skipped by its own `if` counts as a successful
# required check). Only the optional dependency-review job keeps the ACTIONS_ENABLED switch.
name: license-sbom
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: T-675 proof-only forced failure (throwaway, do not merge)
        run: |
          echo "sbom no longer carries a variable condition, so the required context now runs" \
               "unconditionally and reflects a real result instead of a skip-as-success. This" \
               "step forces that real result to be a failure, to show the required check can" \
               "go red with the ACTIONS_ENABLED variable read as deleted (dependency-review's" \
               "condition below points at a variable name that does not exist)."
          exit 1
      - name: Generate SBOM (SPDX JSON, includes detected licenses)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
      - name: Fail on disallowed licenses in the SBOM
        run: |
          node -e '
            const s = JSON.parse(require("fs").readFileSync("sbom.spdx.json","utf8"));
            const deny = /GPL-2\.0-only|GPL-3\.0|AGPL|SSPL|BUSL|CC-BY-NC/i;
            const bad = (s.packages||[]).filter(p => deny.test(p.licenseConcluded||"") || deny.test(p.licenseDeclared||""));
            for (const p of bad) console.log(`DENY ${p.name}@${p.versionInfo}: ${p.licenseDeclared||p.licenseConcluded}`);
            if (bad.length) process.exit(1);
            console.log(`ok: ${(s.packages||[]).length} packages, none on the deny list`);
          '
  dependency-review:
    if: vars.ACTIONS_ENABLED_DELETED_T675_PROOF == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          deny-licenses: GPL-2.0-only, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0, BUSL-1.1
